name: Frontend screenshots

# Takes a screenshot of each state of each page that the screenshot specs reach, in each window
# and theme, and uploads them as the artifact "screenshots". It runs only when asked: on a branch
# with `gh workflow run frontend-screenshots.yml --ref <branch>`, or on a pull request when the
# label "screenshots" is added, then at each push while the label stays.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      projects:
        description: The windows and themes to take, separated by spaces, such as "phone-* laptop-dark"
        default: '*'

concurrency:
  group: frontend-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  screenshots:
    name: Screenshots
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'screenshots') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'screenshots'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # A pull request takes every window and theme.
      - env:
          PROJECTS: ${{ inputs.projects || '*' }}
        run: |
          set -f
          args=()
          for project in $PROJECTS; do args+=(--project "$project"); done
          pnpm screenshots "${args[@]}"
      # Also after a failure: the states that were taken are still worth a look.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: frontend/screenshots
          retention-days: 7
          if-no-files-found: error
