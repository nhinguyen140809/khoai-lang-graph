name: Backend CI

# Runs on every pull request so that the required check "Backend CI result" always reports. A pull
# request that changes nothing under backend/ skips the checks, and a skipped job counts as passed.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  # A new push to a pull request cancels its older run; a run on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A push to main is already filtered by paths, and a manual run checks everything.
          if [ "$EVENT" != pull_request ]; then
            echo backend=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qE '^(backend/|\.github/workflows/backend-ci\.yml$)' <<< "$files"; then
            echo backend=true >> "$GITHUB_OUTPUT"
          else
            echo backend=false >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Python 3.13: the newest release that the locked packages build on.
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run lint-imports
      # -v prints each test as it starts, so a hang shows which test it is; after 120 s without
      # an end, faulthandler prints the stack of every thread. Output is not buffered.
      - run: uv run pytest -v -o faulthandler_timeout=120 --durations=15
        env:
          PYTHONUNBUFFERED: '1'

  # The pages against the real backend, which answers with the scripted model and the fixture
  # corpus (no key, no cost). It runs for a change of the backend, or by hand.
  e2e:
    name: E2E (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Starts the backend on a database made from the demo seed, and the app proxied to it.
      - run: pnpm e2e:backend
      # The CI reporter writes no HTML report; the traces of retried tests are in test-results.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-backend-test-results
          path: frontend/test-results
          retention-days: 7

  # The only required check of the backend: it fails when a job above failed or was cancelled, and
  # passes when they passed or were skipped.
  result:
    name: Backend CI result
    needs: [changes, check, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
